<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1100" viewBox="0 0 1680 1100">
  <defs>
    <linearGradient id="g-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7fafc"/>
    </linearGradient>
    <linearGradient id="g-simple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9f3ff"/>
      <stop offset="100%" stop-color="#d7ebff"/>
    </linearGradient>
    <linearGradient id="g-complex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3e8"/>
      <stop offset="100%" stop-color="#ffe7d2"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1f2937" />
    </marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2563eb" />
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#ea580c" />
    </marker>
    <style><![CDATA[
      .title   { font-family: Inter, Arial, sans-serif; font-size:26px; font-weight:800; fill:#0f172a; }
      .subtitle{ font-family: Inter, Arial, sans-serif; font-size:14px; fill:#475569; }
      .panel   { fill:url(#g-panel); stroke:#cbd5e1; stroke-width:1.2; rx:14; filter:url(#ds); }
      .box     { fill:#ffffff; stroke:#d1d5db; stroke-width:1.2; rx:10; filter:url(#ds); }
      .memS    { fill:url(#g-simple); stroke:#60a5fa; stroke-width:1.4; rx:12; filter:url(#ds); }
      .memC    { fill:url(#g-complex); stroke:#fb923c; stroke-width:1.4; rx:12; filter:url(#ds); }
      .pill    { fill:#111827; stroke:#111827; rx:14; }
      .pillText{ font-family: Inter, Arial, sans-serif; font-size:12px; fill:#ffffff; font-weight:700; }
      .text    { font-family: Inter, Arial, sans-serif; font-size:15px; fill:#0f172a; }
      .small   { font-family: Inter, Arial, sans-serif; font-size:12px; fill:#475569; }
      .arrow   { stroke:#1f2937; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .arrowBlue{ stroke:#2563eb; stroke-width:2.4; fill:none; marker-end:url(#arrow-blue); }
      .arrowOrange{ stroke:#ea580c; stroke-width:2.4; fill:none; marker-end:url(#arrow-orange); }
      .badge   { fill:#111827; rx:8; }
      .badgeText { font-family: Inter, Arial, sans-serif; font-size:11px; fill:#ffffff; font-weight:700; }
      .legend  { fill:#fefce8; stroke:#fde68a; }
    ]]></style>
  </defs>

  <!-- Header -->
  <text x="42" y="54" class="title">Discussion Round — End-to-End Flow (Agent last)</text>
  <text x="42" y="78" class="subtitle">Emphasizing when memory is updated (Complex vs Simple) and how prompts differ</text>

  <!-- Lanes background -->
  <rect x="30" y="100" width="1620" height="880" class="panel"/>

  <!-- Step 1: Start & Prompt with history -->
  <g transform="translate(60,130)">
    <rect x="0" y="0" width="300" height="110" class="box"/>
    <rect x="-10" y="-22" width="66" height="26" class="pill"/>
    <text x="-2" y="-6" class="pillText">STEP 1</text>
    <text x="16" y="32" class="text">Start of Round</text>
    <text x="16" y="58" class="small">Agent is last in speaking order</text>
  </g>

  <path d="M360 185 C 420 185, 450 150, 520 150" class="arrow"/>

  <g transform="translate(520,120)">
    <rect x="0" y="0" width="420" height="140" class="box"/>
    <rect x="-10" y="-22" width="66" height="26" class="pill"/>
    <text x="-2" y="-6" class="pillText">STEP 2</text>
    <text x="16" y="32" class="text">Discussion Prompt (with Public History)</text>
    <text x="16" y="58" class="small">• Group composition</text>
    <text x="16" y="78" class="small">• Public discussion history (trimmed as needed)</text>
    <text x="16" y="98" class="small">• Standard instructions: Name, Role, Bank, Phase, Round, Memory, Personality</text>
  </g>

  <path d="M940 190 C 1020 190, 1060 155, 1120 155" class="arrow"/>

  <!-- Step 3: Agent statement -->
  <g transform="translate(1120,120)">
    <rect x="0" y="0" width="430" height="140" class="box"/>
    <rect x="-10" y="-22" width="66" height="26" class="pill"/>
    <text x="-2" y="-6" class="pillText">STEP 3</text>
    <text x="16" y="32" class="text">Agent Generates Statement</text>
    <text x="16" y="58" class="small">Runner.run(discussion_prompt, context)</text>
    <text x="16" y="78" class="small">Optional internal reasoning captured separately</text>
  </g>

  <!-- Complex memory update: discussion entry -->
  <path d="M1335 262 C 1335 300, 1335 320, 1320 350" class="arrowOrange"/>
  <g transform="translate(1060,350)">
    <rect x="0" y="0" width="600" height="140" class="memC"/>
    <rect x="12" y="-16" width="160" height="26" class="badge"/>
    <text x="22" y="3" class="badgeText">MEMORY UPDATE — COMPLEX</text>
    <text x="20" y="40" class="text">Discussion Entry (LLM rewrite via MemoryManager)</text>
    <text x="20" y="66" class="small">• “Round N: Your statement: …” (≤ 300 chars)</text>
    <text x="20" y="86" class="small">• “Internal reasoning: …” (≤ 200 chars, if present)</text>
    <text x="20" y="106" class="small">• Outcome: made discussion statement</text>
  </g>

  <!-- Step 4: Vote initiation prompt -->
  <path d="M320 260 C 320 320, 320 330, 330 380" class="arrow"/>
  <g transform="translate(60,380)">
    <rect x="0" y="0" width="440" height="120" class="box"/>
    <rect x="-10" y="-22" width="66" height="26" class="pill"/>
    <text x="-2" y="-6" class="pillText">STEP 4</text>
    <text x="16" y="32" class="text">Vote Initiation Prompt</text>
    <text x="16" y="58" class="small">Includes agent’s recent statement for consistency</text>
  </g>

  <path d="M500 438 C 600 438, 650 438, 700 438" class="arrow"/>

  <g transform="translate(700,380)">
    <rect x="0" y="0" width="330" height="120" class="box"/>
    <text x="16" y="38" class="text">Agent: “Yes, initiate voting”</text>
    <text x="16" y="64" class="small">Parsed by UtilityAgent → boolean</text>
  </g>

  <!-- Simple memory update: vote initiation -->
  <path d="M865 500 C 900 530, 930 540, 980 540" class="arrowBlue"/>
  <g transform="translate(980,500)">
    <rect x="0" y="0" width="480" height="110" class="memS"/>
    <rect x="12" y="-16" width="145" height="26" class="badge"/>
    <text x="22" y="3" class="badgeText">MEMORY UPDATE — SIMPLE</text>
    <text x="20" y="40" class="text">Vote Initiation</text>
    <text x="20" y="66" class="small">Appends: “Round N: You chose to initiate voting.”</text>
    <text x="20" y="86" class="small">If memory > ~90% of limit → compress</text>
  </g>

  <!-- Step 5: Group confirmation -->
  <path d="M1220 610 C 1220 640, 1220 660, 1220 690" class="arrow"/>
  <g transform="translate(1040,690)">
    <rect x="0" y="0" width="360" height="110" class="box"/>
    <rect x="-10" y="-22" width="66" height="26" class="pill"/>
    <text x="-2" y="-6" class="pillText">STEP 5</text>
    <text x="16" y="36" class="text">Group Confirmation</text>
    <text x="16" y="62" class="small">All participants agree to vote</text>
  </g>

  <!-- Simple memory update: confirmation -->
  <path d="M1220 805 C 1220 835, 1220 855, 1220 880" class="arrowBlue"/>
  <g transform="translate(980,880)">
    <rect x="0" y="0" width="480" height="110" class="memS"/>
    <rect x="12" y="-16" width="145" height="26" class="badge"/>
    <text x="22" y="3" class="badgeText">MEMORY UPDATE — SIMPLE</text>
    <text x="20" y="40" class="text">Confirmation</text>
    <text x="20" y="66" class="small">Appends: “You agreed to participate in voting.”</text>
    <text x="20" y="86" class="small">Compress if near limit</text>
  </g>

  <!-- Step 6: Secret ballot (two-stage) -->
  <g transform="translate(60,690)">
    <rect x="0" y="0" width="420" height="110" class="box"/>
    <rect x="-10" y="-22" width="66" height="26" class="pill"/>
    <text x="-2" y="-6" class="pillText">STEP 6</text>
    <text x="16" y="36" class="text">Secret Ballot — Principle Choice</text>
    <text x="16" y="62" class="small">Agent selects Principle 3 (Average + Floor)</text>
  </g>

  <!-- Simple memory update: ballot choice -->
  <path d="M480 745 C 560 745, 600 770, 700 770" class="arrowBlue"/>
  <g transform="translate(700,730)">
    <rect x="0" y="0" width="330" height="120" class="memS"/>
    <rect x="12" y="-16" width="145" height="26" class="badge"/>
    <text x="22" y="3" class="badgeText">MEMORY UPDATE — SIMPLE</text>
    <text x="20" y="40" class="text">Ballot Choice</text>
    <text x="20" y="66" class="small">“Secret ballot: I voted for Principle 3.”</text>
    <text x="20" y="86" class="small">Compress if near limit</text>
  </g>

  <g transform="translate(60,830)">
    <rect x="0" y="0" width="420" height="110" class="box"/>
    <text x="16" y="36" class="text">Secret Ballot — Amount</text>
    <text x="16" y="62" class="small">Agent specifies floor = $18,000</text>
  </g>

  <!-- Simple memory update: amount specification -->
  <path d="M480 885 C 560 885, 600 905, 700 905" class="arrowBlue"/>
  <g transform="translate(700,860)">
    <rect x="0" y="0" width="330" height="120" class="memS"/>
    <rect x="12" y="-16" width="145" height="26" class="badge"/>
    <text x="22" y="3" class="badgeText">MEMORY UPDATE — SIMPLE</text>
    <text x="20" y="40" class="text">Amount</text>
    <text x="20" y="66" class="small">“Constraint amount specified: $18,000.”</text>
    <text x="20" y="86" class="small">Compress if near limit</text>
  </g>

  <!-- Optional: Final results (complex) -->
  <g transform="translate(60,540)">
    <rect x="0" y="0" width="420" height="110" class="box"/>
    <rect x="-10" y="-22" width="66" height="26" class="pill"/>
    <text x="-2" y="-6" class="pillText">STEP 7</text>
    <text x="16" y="36" class="text">Consensus & Final Results</text>
    <text x="16" y="62" class="small">Group agrees: Principle 3 with $18,000</text>
  </g>

  <path d="M480 595 C 700 595, 820 595, 1060 595" class="arrowOrange"/>
  <g transform="translate(1060,560)">
    <rect x="0" y="0" width="600" height="140" class="memC"/>
    <rect x="12" y="-16" width="160" height="26" class="badge"/>
    <text x="22" y="3" class="badgeText">MEMORY UPDATE — COMPLEX</text>
    <text x="20" y="40" class="text">Final Phase 2 Results</text>
    <text x="20" y="66" class="small">“Final Phase 2 Results: {agreed principle/amount, earnings}”</text>
    <text x="20" y="86" class="small">Full LLM rewrite with compression safeguards</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1240,130)">
    <rect x="0" y="0" width="390" height="180" class="legend"/>
    <text x="16" y="30" class="text" style="font-weight:800;">Legend</text>
    <rect x="16" y="46" width="20" height="14" class="memC"/>
    <text x="44" y="58" class="small">Complex memory update (LLM rewrite)</text>
    <rect x="16" y="74" width="20" height="14" class="memS"/>
    <text x="44" y="86" class="small">Simple append (post-append compression if near limit)</text>
    <text x="16" y="114" class="small">Discussion truncation: statement ≤ 300, reasoning ≤ 200</text>
    <text x="16" y="136" class="small">Instructions always include Name, Role, Bank, Phase, Round, Memory, Personality</text>
  </g>

</svg>

