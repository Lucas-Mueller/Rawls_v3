<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill:#f9f9f9; stroke:#444; stroke-width:1.2; }
      .phase { fill:#eef7ff; stroke:#72a7ff; }
      .phase2 { fill:#fff4ec; stroke:#ffb27a; }
      .title { font-family: Arial, sans-serif; font-size:16px; font-weight:bold; fill:#222; }
      .text { font-family: Arial, sans-serif; font-size:13px; fill:#222; }
      .arrow { stroke:#333; stroke-width:1.2; marker-end:url(#arrowhead); fill:none; }
      .note { fill:#ffffcc; stroke:#e6e68a; }
    ]]></style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Phase 1 cluster -->
  <rect x="40" y="40" width="600" height="340" rx="8" class="phase"/>
  <text x="50" y="64" class="title">Phase 1</text>

  <rect x="70" y="90" width="200" height="60" rx="6" class="box"/>
  <text x="80" y="112" class="text">Phase1Manager</text>
  <text x="80" y="130" class="text">(Orchestration)</text>

  <rect x="310" y="90" width="250" height="60" rx="6" class="box"/>
  <text x="320" y="112" class="text">ParticipantAgent (LLM)</text>
  <text x="320" y="130" class="text">Runner.run + Instructions</text>

  <rect x="70" y="180" width="220" height="60" rx="6" class="box"/>
  <text x="80" y="202" class="text">MemoryManager</text>
  <text x="80" y="220" class="text">LLM memory updates</text>

  <rect x="320" y="180" width="240" height="60" rx="6" class="box"/>
  <text x="330" y="202" class="text">UtilityAgent</text>
  <text x="330" y="220" class="text">Compression / parsing</text>

  <rect x="70" y="270" width="490" height="80" rx="6" class="box"/>
  <text x="80" y="292" class="text">LanguageManager</text>
  <text x="80" y="310" class="text">Prompts, context formatting, localization</text>

  <path d="M270 120 L 310 120" class="arrow"/>
  <text x="270" y="110" class="text">prompt</text>

  <path d="M180 180 L 180 150" class="arrow"/>
  <text x="120" y="170" class="text">round_content</text>

  <path d="M290 210 L 320 210" class="arrow"/>
  <text x="295" y="200" class="text">compress-if-needed</text>

  <!-- Phase 2 cluster -->
  <rect x="40" y="420" width="600" height="420" rx="8" class="phase2"/>
  <text x="50" y="444" class="title">Phase 2</text>

  <rect x="70" y="470" width="230" height="60" rx="6" class="box"/>
  <text x="80" y="492" class="text">Phase2Manager</text>
  <text x="80" y="510" class="text">Orchestration</text>

  <rect x="340" y="470" width="250" height="60" rx="6" class="box"/>
  <text x="350" y="492" class="text">MemoryService</text>
  <text x="350" y="510" class="text">Truncation, routing</text>

  <rect x="70" y="560" width="230" height="60" rx="6" class="box"/>
  <text x="80" y="582" class="text">DiscussionService</text>
  <text x="80" y="600" class="text">Prompts + history mgmt</text>

  <rect x="340" y="560" width="250" height="60" rx="6" class="box"/>
  <text x="350" y="582" class="text">SelectiveMemoryManager</text>
  <text x="350" y="600" class="text">Simple vs complex</text>

  <rect x="70" y="650" width="230" height="60" rx="6" class="box"/>
  <text x="80" y="672" class="text">VotingService</text>
  <text x="80" y="690" class="text">Initiation, confirm, ballot</text>

  <rect x="340" y="650" width="250" height="60" rx="6" class="box"/>
  <text x="350" y="672" class="text">MemoryManager</text>
  <text x="350" y="690" class="text">LLM memory updates</text>

  <rect x="70" y="740" width="520" height="80" rx="6" class="box"/>
  <text x="80" y="762" class="text">ParticipantAgent (LLM) + LanguageManager</text>
  <text x="80" y="780" class="text">Runner.run with full instructions + localized content</text>

  <!-- Arrows in Phase 2 -->
  <path d="M300 500 L 340 500" class="arrow"/>
  <text x="305" y="490" class="text">updates</text>

  <path d="M300 590 L 340 590" class="arrow"/>
  <text x="305" y="580" class="text">statement</text>

  <path d="M300 680 L 340 680" class="arrow"/>
  <text x="305" y="670" class="text">vote mem</text>

  <path d="M465 590 L 465 650" class="arrow"/>
  <text x="470" y="625" class="text">route</text>

  <!-- Right-side legend -->
  <rect x="700" y="40" width="650" height="820" rx="8" class="box"/>
  <text x="715" y="64" class="title">Instruction & Content Elements</text>
  <text x="725" y="90" class="text">Instructions (always sent):</text>
  <text x="740" y="110" class="text">• Name, Role Description, Bank Balance</text>
  <text x="740" y="130" class="text">• Phase, Round, Memory (full display)</text>
  <text x="740" y="150" class="text">• Personality, Phase Instructions</text>
  <text x="740" y="170" class="text">• Language Instruction, +/− Experiment Explanation</text>

  <text x="725" y="205" class="text">Discussion prompts include:</text>
  <text x="740" y="225" class="text">• Group composition</text>
  <text x="740" y="245" class="text">• Public discussion history</text>
  <text x="740" y="265" class="text">• Optional internal reasoning section</text>

  <text x="725" y="300" class="text">Memory updates:</text>
  <text x="740" y="320" class="text">• Complex → MemoryManager (LLM)</text>
  <text x="740" y="340" class="text">• Simple → direct append</text>
  <text x="740" y="360" class="text">• Post-append compression if &gt;90% limit</text>

  <text x="725" y="395" class="text">Compression:</text>
  <text x="740" y="415" class="text">• UtilityAgent (targeted) or fallback truncation</text>

  <text x="725" y="450" class="text">Voting flow:</text>
  <text x="740" y="470" class="text">• Initiation prompt (optional recent statement)</text>
  <text x="740" y="490" class="text">• Confirmation prompts</text>
  <text x="740" y="510" class="text">• Two-stage ballot (principle, amount)</text>
  <text x="740" y="530" class="text">• Memory insertions for choices/amounts</text>

  <text x="725" y="565" class="text">Finalization:</text>
  <text x="740" y="585" class="text">• Final results memory update</text>
  <text x="740" y="605" class="text">• Phase 2 memory preserved in results</text>

  <rect x="715" y="640" width="610" height="190" rx="6" class="note"/>
  <text x="725" y="660" class="title">Key Guarantees</text>
  <text x="730" y="680" class="text">1) Continuity: Phase 1 memory validated and carried into Phase 2.</text>
  <text x="730" y="700" class="text">2) Cost-control: Selective routing + truncation + compression.</text>
  <text x="730" y="720" class="text">3) Localization: All content via LanguageManager.</text>
  <text x="730" y="740" class="text">4) Guardrails: Post-append compression near limit.</text>
  <text x="730" y="760" class="text">5) Clarity: Discussion history embedded in prompts.</text>

</svg>

