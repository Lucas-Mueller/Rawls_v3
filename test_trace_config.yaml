# Test configuration for tracing validation
language: "English"
memory_guidance_style: "narrative"

# Minimal experiment settings for quick testing
num_rounds: 1  # Only 1 application round
phase2_rounds: 1  # Only 1 discussion round

# Two simple agents
agents:
  - name: "Agent_A"
    personality: "A practical decision-maker who prefers simple solutions."
    model: "gpt-4.1-mini" 
    temperature: 0.0
    reasoning_enabled: false
    memory_character_limit: 10000

  - name: "Agent_B" 
    personality: "A careful thinker who considers all options."
    model: "gpt-4.1-mini"
    temperature: 0.0
    reasoning_enabled: false
    memory_character_limit: 10000

# Utility agent settings  
utility_agent_model: "gpt-4.1-mini"
utility_agent_temperature: 0.0

# Phase 2 settings
voting_detection_mode: "simple"  # Simple mode for faster testing