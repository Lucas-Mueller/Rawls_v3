language: "English" 

seed: 42

agents:
  - name: "Gordon"
    personality: "You are committed to maximizing overall economic output."
    model: "gpt-5-nano"
    memory_character_limit: 25000
    reasoning_enabled: false
    temperature: 0
    
  - name: "James" 
    personality: "You care for the poor"
    model: "gpt-5-nano"
    temperature: 0
    memory_character_limit: 25000
    reasoning_enabled: false

  - name: "Alice" 
    personality: "You want to comprpomrise"
    model: "gpt-5-nano"
    temperature: 0
    memory_character_limit: 25000
    reasoning_enabled: false
    

utility_agent_model: 'google/gemini-2.0-flash-lite-001'
utility_agent_temperature: 0.0

phase2_rounds: 5
distribution_range_phase2: [4, 8]

# Income class assignment probabilities (used when original_values_mode is disabled)
income_class_probabilities:
  high: 0.05          # 5%
  medium_high: 0.10   # 10%
  medium: 0.50        # 50%
  medium_low: 0.25    # 25%
  low: 0.1           # 10%

# Original Values Mode Configuration
original_values_mode:
  enabled: true                 

logging:
  verbosity_level: "debug"  # or minimal, detailed, debug
  use_colors: true
  show_progress_bars: true