# Default Frohlich Experiment configuration
# Language alternatives: Mandarin, Spanish
language: English
seed: 42

selective_memory_updates: false  # Forces legacy verbose system
memory_guidance_style: structured  # Default memory prompts style
phase2_include_internal_reasoning_in_memory: true
include_experiment_explanation_each_turn: true
memory_update_threshold: comprehensive

agents:
  - name: Comrade Che
    personality: "You are a Cuban communist who prioritizes protecting the poor."
    model: gpt-4.1-nano
    temperature: 0.0
    memory_character_limit: 25000
    reasoning_enabled: true
  - name: Alice
    personality: "You are a young American college student focused on fairness."
    model: gpt-4.1-nano
    temperature: 0.0
    memory_character_limit: 25000
    reasoning_enabled: true
  - name: High Performer Gordon Gekko
    personality: "You are Gordon Gekko from Wall Street: a ruthless investor obsessed with profit and indifferent to social safety nets."
    model: gpt-4.1-nano
    temperature: 0.0
    memory_character_limit: 25000
    reasoning_enabled: true
  - name: Boris
    personality: "You are a pragmatic Russian negotiator with a focus on stability."
    model: gpt-4.1-nano
    temperature: 0.0
    memory_character_limit: 25000
    reasoning_enabled: true
  - name: Lewis Hamilton
    personality: "You are a competitive British Formula 1 driver, seven-time world champion, aware of your wealth and influence."
    model: gpt-4.1-nano
    temperature: 0.0
    memory_character_limit: 25000
    reasoning_enabled: true

utility_agent_model: gpt-4.1-nano
utility_agent_temperature: 0.0

phase2_rounds: 10
distribution_range_phase1: [0.5, 2.0]
distribution_range_phase2: [4, 8]

income_class_probabilities:
  high: 0.05
  medium_high: 0.10
  medium: 0.50
  medium_low: 0.25
  low: 0.10

original_values_mode:
  enabled: true
