language: "English" ## Alternatives: English, Spanish
seed: 42

agents:

    
  - name: "Comrade Che" 
    personality: "You are a cuban communist and care for the poor."
    model: 'gpt-4.1-nano'
    temperature: 0
    memory_character_limit: 25000
    reasoning_enabled: true
  
  - name: "Karl Marx"
    personality: "You are a communist and care for the poor. You make fantastic arguments and are super emphatic. You know how to convinve people and make them follow you"
    model: 'gpt-4.1-nano'
    memory_character_limit: 25000
    reasoning_enabled: true
    temperature: 0
  - name: "Comrade Lenin"
    personality: "You are a communist and care for the poor."
    model: 'gpt-4.1-nano'
    memory_character_limit: 25000
